# Render blueprint for the Roomick API.
#
# Optional — everything here can be clicked together in the dashboard instead.
# Checked in so the deployment's shape is reviewable and reproducible rather
# than living only in someone's browser session.
#
# Apply with: Render Dashboard → New → Blueprint → point at this repo.

databases:
  - name: roomick-postgres
    databaseName: roomick
    user: roomick
    plan: starter # `free` expires after 90 days; starter is the smallest durable tier
    # Render's nearest region to West Africa. The database and the API must
    # share a region — change both together, and only before the first deploy.
    region: frankfurt

services:
  - type: web
    name: roomick-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt # the database's region — see above
    healthCheckPath: /api/v1/system/health # @Public(), no auth needed — see SystemController
    # Migrations run as a release step, BEFORE the new instance takes traffic.
    # Deliberately `migrate deploy` (applies committed migrations only) and never
    # `migrate dev` — that one tries to author new migrations and needs a shadow
    # database it will not have here.
    preDeployCommand: npx prisma migrate deploy

    # --- Persistent disk ------------------------------------------------------
    # The app writes four kinds of file to disk: encrypted guest ID photos,
    # registration-card PDFs, GDPR exports, and nightly backup dumps (see
    # DOCUMENT_STORAGE_DIR / BACKUP_STORAGE_DIR below). Everything else is in
    # Postgres.
    #
    # A container filesystem WITHOUT a disk is reset on each deploy, so this
    # mount is what keeps those four durable. Note a service with a disk cannot
    # run more than one instance. Once the STORAGE_S3_* bucket below is set,
    # new documents and backups go to the bucket instead (files already on the
    # disk still open from it), and room photos can be uploaded.
    disk:
      name: roomick-data
      mountPath: /var/roomick
      sizeGB: 5

    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT itself; main.ts reads it and binds 0.0.0.0.
      - key: DATABASE_URL
        fromDatabase:
          name: roomick-postgres
          property: connectionString
      # Generated once by Render and then held constant. NEVER rotate
      # ENCRYPTION_KEY casually: guest ID documents and ID numbers are
      # AES-256-GCM encrypted with it, and a new key makes every existing one
      # permanently unreadable.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Must be exactly 64 hex chars (32 bytes) — Joi rejects anything else at
      # boot. Render's generateValue does not guarantee that shape, so set this
      # one by hand:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: ENCRYPTION_KEY
        sync: false
      # The deployed frontend origin, e.g. https://roomick.vercel.app
      # Comma-separated for more than one. Without this, every browser request
      # from the frontend is blocked by CORS.
      - key: CORS_ORIGINS
        sync: false
      - key: DOCUMENT_STORAGE_DIR
        value: /var/roomick/documents
      - key: BACKUP_STORAGE_DIR
        value: /var/roomick/backups
      # Optional — error tracking stays entirely off while unset (src/instrument.ts).
      - key: SENTRY_DSN
        sync: false
      # This API's public address — marketing emails' pixel, links and unsubscribe point here.
      - key: PUBLIC_API_BASE_URL
        sync: false
      # The web app's public address (the Vercel URL) — staff invitations,
      # password resets, email confirmation and guests' "Manage your booking"
      # links point here. Required: the API won't start in production without it.
      - key: PUBLIC_WEB_BASE_URL
        sync: false
      # Email: nothing is sent until SMTP_HOST is set (any provider's SMTP —
      # Resend, Postmark, Amazon SES…). MAIL_FROM is required with it.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # The same long random value on the web app (Vercel) — sign-ins reach this
      # API through the web app's own address, and this is how the API trusts it
      # to say which visitor each one is from (so rate limits are per visitor).
      # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: WEB_PROXY_SECRET
        sync: false
      # Optional — an S3-compatible bucket (Cloudflare R2, Amazon S3, Backblaze B2,
      # Spaces). Room photo uploads, and guest documents and backups kept in the
      # bucket rather than on the disk. Off until bucket, key id and secret are set.
      # For R2: endpoint https://<account id>.r2.cloudflarestorage.com, region auto.
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        value: auto
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
