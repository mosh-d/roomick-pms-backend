services:
  postgres:
    image: postgres:16-alpine
    container_name: roomick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomick
      POSTGRES_PASSWORD: roomick
      POSTGRES_DB: roomick
    ports:
      - '5432:5432'
    volumes:
      - roomick_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roomick -d roomick']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomick_pgdata:
